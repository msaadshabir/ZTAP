name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: true

      - name: Get version from tag
        id: version
        run: printf 'VERSION=%s\n' "${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          BASENAME="ztap-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          BINARY_NAME="${BASENAME}"
          if [ "${GOOS}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          go build -ldflags="-s -w -X main.Version=${VERSION}" -o "dist/${BINARY_NAME}" .

          # Create archive
          cd dist
          if [ "${GOOS}" = "windows" ]; then
            zip "${BASENAME}.zip" "${BINARY_NAME}"
          else
            tar czf "${BASENAME}.tar.gz" "${BINARY_NAME}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ztap-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: artifacts

      - name: Get version from tag
        id: version
        run: printf 'VERSION=%s\n' "${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "Generating changelog for ${VERSION}"

          # Extract changelog section if exists
          if [ -f "CHANGELOG.md" ]; then
            sed -n "/## ${VERSION}/,/## /p" CHANGELOG.md | sed '$d' > release-notes.md
          else
            echo "Release ${VERSION}" > release-notes.md
            echo "" >> release-notes.md
            echo "See commits for details." >> release-notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'rc') || contains(steps.version.outputs.VERSION, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    name: Build and Push Docker Images
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          {
            printf 'VERSION=%s\n' "$VERSION"
            printf 'VERSION_SHORT=%s\n' "${VERSION#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ZTAP image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ztap:latest
            ghcr.io/${{ github.repository_owner }}/ztap:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/ztap:${{ steps.version.outputs.VERSION_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ZTAP Operator image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile.operator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ztap-operator:latest
            ghcr.io/${{ github.repository_owner }}/ztap-operator:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/ztap-operator:${{ steps.version.outputs.VERSION_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Anomaly Detector image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./pkg/anomaly
          file: ./pkg/anomaly/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ztap-anomaly:latest
            ghcr.io/${{ github.repository_owner }}/ztap-anomaly:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/ztap-anomaly:${{ steps.version.outputs.VERSION_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
