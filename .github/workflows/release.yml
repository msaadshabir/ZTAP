name: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        run: go install github.com/anchore/syft/cmd/syft@v1.50.0

      - name: Generate changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "Generating changelog for ${VERSION}"

          # Extract changelog section if exists
          if [ -f "CHANGELOG.md" ]; then
            sed -n "/## ${VERSION}/,/## /p" CHANGELOG.md | sed '$d' > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            {
              echo "Release ${VERSION}"
              echo ""
              echo "See commits for details."
            } > release-notes.md
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SLSA subject hashes
        id: hashes
        shell: bash
        run: echo "hashes=$(base64 -w0 dist/checksums.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          retention-days: 7

  provenance:
    name: SLSA 3 Provenance
    needs: [goreleaser]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generic-generator.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true
      provenance-name: ztap.intoto.jsonl

  docker-release:
    name: Build and Push Docker Images
    needs: goreleaser
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          {
            printf 'VERSION=%s\n' "$VERSION"
            printf 'VERSION_SHORT=%s\n' "${VERSION#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ZTAP image
        id: build-ztap
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ztap:latest
            ghcr.io/${{ github.repository_owner }}/ztap:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/ztap:${{ steps.version.outputs.VERSION_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ZTAP Operator image
        id: build-operator
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.operator
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ztap-operator:latest
            ghcr.io/${{ github.repository_owner }}/ztap-operator:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/ztap-operator:${{ steps.version.outputs.VERSION_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Anomaly Detector image
        id: build-anomaly
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./internal/anomaly
          file: ./internal/anomaly/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ztap-anomaly:latest
            ghcr.io/${{ github.repository_owner }}/ztap-anomaly:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/ztap-anomaly:${{ steps.version.outputs.VERSION_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign images
        env:
          COSIGN_YES: "true"
          IMAGE_ZTAP: ghcr.io/${{ github.repository_owner }}/ztap@${{ steps.build-ztap.outputs.digest }}
          IMAGE_OPERATOR: ghcr.io/${{ github.repository_owner }}/ztap-operator@${{ steps.build-operator.outputs.digest }}
          IMAGE_ANOMALY: ghcr.io/${{ github.repository_owner }}/ztap-anomaly@${{ steps.build-anomaly.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_ZTAP}"
          cosign sign --yes "${IMAGE_OPERATOR}"
          cosign sign --yes "${IMAGE_ANOMALY}"
