name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/copilot-instructions.md"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: "0 2 * * 1"

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python || steps.defaults.outputs.python }}
      docker: ${{ steps.filter.outputs.docker || steps.defaults.outputs.docker }}
      ebpf: ${{ steps.filter.outputs.ebpf || steps.defaults.outputs.ebpf }}

    steps:
      - name: Defaults for non-PR events
        id: defaults
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "python=true"
            echo "docker=true"
            echo "ebpf=true"
          } >> "$GITHUB_OUTPUT"

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        with:
          token: ${{ github.token }}
          filters: |
            python:
              - 'pkg/anomaly/**'
            docker:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'pkg/anomaly/Dockerfile'
              - 'Dockerfile.operator'
              - '.dockerignore'
            ebpf:
              - 'bpf/**'
              - 'pkg/enforcer/**'

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.12.2
          args: --timeout=5m

  actionlint:
    name: Actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12
        with:
          args: -color

  test-go:
    name: Go Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v -covermode=atomic -coverpkg=./pkg/... -coverprofile=coverage-${{ matrix.os }}.out -timeout 10m

      - name: Coverage report (pkg/, advisory)
        if: ${{ hashFiles(format('coverage-{0}.out', matrix.os)) != '' }}
        shell: bash
        run: go run ./cmd/covergate -coverprofile coverage-${{ matrix.os }}.out -repo . || echo "coverage gate reported uncovered statements (advisory only in CI)"

      - name: Coverage report skipped (no profile)
        if: ${{ hashFiles(format('coverage-{0}.out', matrix.os)) == '' }}
        run: echo "coverage profile coverage-${{ matrix.os }}.out not found; skipping advisory coverage gate"

      - name: Upload coverage artifact
        if: failure() || github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ matrix.os }}
          path: coverage-${{ matrix.os }}.out
          if-no-files-found: ignore
          retention-days: 14

  # Windows is covered via the 3-OS matrix in test-go.

  test-integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run policy enforcer integration tests
        run: go test -v -timeout=60s -tags=integration ./pkg/enforcer/... -run TestPolicyEnforcer

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate

  test-python:
    name: Python Anomaly Detection Tests
    runs-on: ubuntu-24.04
    needs: [lint, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pkg/anomaly/requirements.txt

      - name: Install dependencies
        working-directory: pkg/anomaly
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Run Python tests
        working-directory: pkg/anomaly
        run: python -m pytest test_service.py -v --cov=service --cov-report=xml

      - name: Upload Python coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-coverage
          path: pkg/anomaly/coverage.xml
          retention-days: 14

  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs: [lint, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ebpf == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ztap
            context: .
            file: ./Dockerfile
            tag: ztap:test
          - image: ztap-anomaly
            context: ./pkg/anomaly
            file: ./pkg/anomaly/Dockerfile
            tag: ztap-anomaly:test
          - image: ztap-operator
            context: .
            file: ./Dockerfile.operator
            tag: ztap-operator:test

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  docker-compose-test:
    name: Docker Compose Test
    runs-on: ubuntu-24.04
    needs: [docker-build]
    if: github.event_name != 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Test Docker Compose Stack
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 60
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml down

  ebpf-verification:
    name: eBPF Verification (Linux)
    runs-on: ubuntu-24.04
    needs: [lint, test-go, changes]
    # Forked PRs cannot run privileged eBPF steps
    if: (github.event_name != 'pull_request' || needs.changes.outputs.ebpf == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make

      - name: Download dependencies
        run: go mod download

      - name: Compile eBPF program
        run: |
          make -C bpf
          sudo mkdir -p /usr/local/share/ztap/bpf
          sudo cp -v bpf/filter.o /usr/local/share/ztap/bpf/filter.o

      - name: Inspect eBPF object (ELF)
        run: |
          which llvm-objdump || true
          which llvm-readelf || true
          echo "ls -l built object and system path" && ls -l bpf/filter.o /usr/local/share/ztap/bpf/filter.o
          echo "readelf -S" && (llvm-readelf -S bpf/filter.o || readelf -S bpf/filter.o)
          echo "objdump -h" && (llvm-objdump -h bpf/filter.o || objdump -h bpf/filter.o)

      - name: Run eBPF integration test
        env:
          ZTAP_BPF_OBJECT: /usr/local/share/ztap/bpf/filter.o
          ZTAP_DEBUG_EBPF: "1"
        run: sudo --preserve-env=PATH,HOME,GOFLAGS,GOMODCACHE,GOCACHE,ZTAP_BPF_OBJECT,ZTAP_DEBUG_EBPF go test -tags integration ./pkg/enforcer -run TestEBPFIntegrationLoadAndAttach -v

  coverage-report:
    name: Generate Coverage Report
    needs: [test-go, test-python]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' && always() && (needs.test-go.result == 'success' || needs.test-python.result == 'success')
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Download all coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: coverage-reports
          pattern: coverage-*
          merge-multiple: false

      - name: Display coverage structure
        run: ls -R coverage-reports

      - name: Generate combined coverage report
        run: |
          {
            printf '## Test Coverage Summary\n\n'
            for file in coverage-reports/coverage-*/coverage-*.out; do
              if [ -f "$file" ]; then
                os=$(basename "$(dirname "$file")")
                os=${os#coverage-}
                printf '### %s\n' "$os"
                go tool cover -func="$file" | tail -1
                printf '\n'
              fi
            done
          } > coverage-summary.md

      - name: Upload coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-summary
          path: coverage-summary.md
          retention-days: 14

  build-check:
    name: Build Check (Multi-Platform)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]') }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out=ztap-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${GOOS}" = "windows" ]; then
            out="${out}.exe"
          fi
          go build -o "${out}" .
          ls -lh "${out}"

  benchmark:
    name: Benchmark Tests
    runs-on: ubuntu-24.04
    needs: test-go
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: |
          go test ./pkg/... -bench=. -benchmem -run=^$ > benchmark-results.txt || true
          cat benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 30

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-24.04
    needs:
      - lint
      - actionlint
      - test-go
      - test-integration
      - test-python
      - docker-build
      - docker-compose-test
      - ebpf-verification
      - build-check
      - dependency-review
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check all jobs status
        run: |
          echo "Job Results:"
          echo "  lint: ${{ needs.lint.result }}"
          echo "  actionlint: ${{ needs.actionlint.result }}"
          echo "  test-go: ${{ needs.test-go.result }}"
          echo "  test-integration: ${{ needs.test-integration.result }}"
          echo "  test-python: ${{ needs.test-python.result }}"
          echo "  docker-build: ${{ needs.docker-build.result }}"
          echo "  docker-compose-test: ${{ needs.docker-compose-test.result }}"
          echo "  ebpf-verification: ${{ needs.ebpf-verification.result }}"
          echo "  build-check: ${{ needs.build-check.result }}"
          echo "  dependency-review: ${{ needs.dependency-review.result }}"
          echo ""

          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ]; then
            echo "Some checks failed"
            exit 1
          elif [ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]; then
            echo "Some checks were cancelled"
            exit 1
          else
            echo "All checks passed!"
          fi
