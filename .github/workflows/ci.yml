name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: "0 2 * * 1"

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python || steps.defaults.outputs.python }}
      docker: ${{ steps.filter.outputs.docker || steps.defaults.outputs.docker }}
      ebpf: ${{ steps.filter.outputs.ebpf || steps.defaults.outputs.ebpf }}

    steps:
      - name: Defaults for non-PR events
        id: defaults
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "python=true"
            echo "docker=true"
            echo "ebpf=true"
          } >> "$GITHUB_OUTPUT"

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        with:
          token: ${{ github.token }}
          filters: |
            python:
              - 'internal/anomaly/**'
            docker:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'internal/anomaly/Dockerfile'
              - 'Dockerfile.operator'
              - '.dockerignore'
            ebpf:
              - 'bpf/**'
              - 'internal/enforcer/**'

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
          # Formatters (gofmt/goimports) are not part of `golangci-lint run` in
          # v2; `fmt: true` applies them so the diff check below can gate on
          # formatting.
          fmt: true

      - name: Fail on unformatted files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git diff --stat
            echo "::error::golangci-lint fmt modified files; run 'golangci-lint fmt' locally before pushing"
            exit 1
          fi

      - name: Run shellcheck
        run: shellcheck scripts/*.sh demo.sh

  zizmor:
    name: zizmor (Actions security)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        run: pipx run zizmor==1.16.3 .github/workflows/

  actionlint:
    name: Actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12
        with:
          args: -color

  proto:
    name: Proto Lint, Breaking & Drift
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # On push/schedule runs the checkout is already on main, and
      # force-updating the checked-out branch would fail. Only PRs need
      # a local main branch for buf's breaking check.
      - name: Fetch main for breaking change detection
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          git branch -f main origin/main

      - name: Run buf lint and breaking checks
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: 1.64.0
          pr_comment: false
          lint: true
          breaking: true
          breaking_against: ".git#branch=main"

      - name: Check generated protos are up to date
        run: ./scripts/gen_proto.sh && git diff --exit-code

  test-go:
    name: Go Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        # -race on the Linux leg only: it covers the race detector where most
        # platform-specific code lives, without tripling CI runtime.
        run: go test ./... -v -covermode=atomic -coverpkg=./internal/...,./cmd/... -coverprofile=coverage-${{ matrix.os }}.out -timeout 10m ${{ matrix.os == 'ubuntu-24.04' && '-race' || '' }}

      - name: Coverage gate (ratchet)
        if: ${{ hashFiles(format('coverage-{0}.out', matrix.os)) != '' }}
        shell: bash
        run: go run ./cmd/covergate -coverprofile coverage-${{ matrix.os }}.out -repo . -baseline .covergate-baseline.json

      - name: Upload coverage artifact
        if: failure() || github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: coverage-${{ matrix.os }}.out
          if-no-files-found: ignore
          retention-days: 14

  # Windows is covered via the 3-OS matrix in test-go.

  test-integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run policy enforcer integration tests
        run: go test -v -timeout=60s -tags=integration ./internal/enforcer/... -run TestPolicyEnforcer

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate

  test-python:
    name: Python Anomaly Detection Tests
    runs-on: ubuntu-24.04
    needs: [lint, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: internal/anomaly/requirements-dev.txt

      - name: Install dependencies
        working-directory: internal/anomaly
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run Python tests
        working-directory: internal/anomaly
        run: python -m pytest test_service.py -v --cov=service --cov-report=xml

      - name: Upload Python coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-coverage
          path: internal/anomaly/coverage.xml
          retention-days: 14

  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs: [lint, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ebpf == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ztap
            context: .
            file: ./Dockerfile
            tag: ztap:test
          - image: ztap-anomaly
            context: ./internal/anomaly
            file: ./internal/anomaly/Dockerfile
            tag: ztap-anomaly:test
          - image: ztap-operator
            context: .
            file: ./Dockerfile.operator
            tag: ztap-operator:test

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  docker-compose-test:
    name: Docker Compose Test
    runs-on: ubuntu-24.04
    needs: [docker-build]
    if: github.event_name != 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Test Docker Compose Stack
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 60
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml down

  ebpf-verification:
    name: eBPF Verification (Linux)
    runs-on: ubuntu-24.04
    needs: [lint, test-go, changes]
    # Forked PRs cannot run privileged eBPF steps
    if: (github.event_name != 'pull_request' || needs.changes.outputs.ebpf == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make

      - name: Download dependencies
        run: go mod download

      - name: Compile eBPF program
        run: |
          make -C bpf
          sudo mkdir -p /usr/local/share/ztap/bpf
          sudo cp -v bpf/filter.o /usr/local/share/ztap/bpf/filter.o

      - name: Check generated eBPF bindings are up to date
        run: |
          go generate ./internal/enforcer/...
          git diff --exit-code -- internal/enforcer/bpf_bpfel.go internal/enforcer/bpf_bpfeb.go

      - name: Inspect eBPF object (ELF)
        run: |
          which llvm-objdump || true
          which llvm-readelf || true
          echo "ls -l built object and system path" && ls -l bpf/filter.o /usr/local/share/ztap/bpf/filter.o
          echo "readelf -S" && (llvm-readelf -S bpf/filter.o || readelf -S bpf/filter.o)
          echo "objdump -h" && (llvm-objdump -h bpf/filter.o || objdump -h bpf/filter.o)

      - name: Run eBPF integration test
        env:
          ZTAP_BPF_OBJECT: /usr/local/share/ztap/bpf/filter.o
          ZTAP_DEBUG_EBPF: "1"
        run: sudo --preserve-env=PATH,HOME,GOFLAGS,GOMODCACHE,GOCACHE,ZTAP_BPF_OBJECT,ZTAP_DEBUG_EBPF go test -tags integration ./internal/enforcer -run TestEBPFIntegrationLoadAndAttach -v

  coverage-report:
    name: Generate Coverage Report
    needs: [test-go, test-python]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' && always() && (needs.test-go.result == 'success' || needs.test-python.result == 'success')
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download all coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: coverage-reports
          pattern: coverage-*
          merge-multiple: false

      - name: Display coverage structure
        run: ls -R coverage-reports

      - name: Generate combined coverage report
        run: |
          {
            printf '## Test Coverage Summary\n\n'
            for file in coverage-reports/coverage-*/coverage-*.out; do
              if [ -f "$file" ]; then
                os=$(basename "$(dirname "$file")")
                os=${os#coverage-}
                printf '### %s\n' "$os"
                go tool cover -func="$file" | tail -1
                printf '\n'
              fi
            done
          } > coverage-summary.md

      - name: Upload coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-summary
          path: coverage-summary.md
          retention-days: 14

  build-check:
    name: Build Check (Multi-Platform)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]') }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="ztap-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            out="${out}.exe"
          fi
          go build -o "${out}" ./cmd/ztap
          ls -lh "${out}"

  fuzz:
    name: Go Fuzz Tests
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run fuzz tests (short)
        run: |
          go test -run='^$' -fuzz='^FuzzParsePolicyKey$' -fuzztime=30s ./internal/cluster
          go test -run='^$' -fuzz='^FuzzParseMappingFile$' -fuzztime=30s ./internal/compliance
          go test -run='^$' -fuzz='^FuzzValidateControlID$' -fuzztime=30s ./internal/compliance

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-24.04
    needs:
      - lint
      - actionlint
      - zizmor
      - proto
      - test-go
      - test-integration
      - test-python
      - docker-build
      - docker-compose-test
      - ebpf-verification
      - build-check
      - dependency-review
      - fuzz
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check all jobs status
        run: |
          echo "Job Results:"
          echo "  lint: ${NEEDS_LINT_RESULT}"
          echo "  actionlint: ${NEEDS_ACTIONLINT_RESULT}"
          echo "  zizmor: ${NEEDS_ZIZMOR_RESULT}"
          echo "  proto: ${NEEDS_PROTO_RESULT}"
          echo "  test-go: ${NEEDS_TEST_GO_RESULT}"
          echo "  test-integration: ${NEEDS_TEST_INTEGRATION_RESULT}"
          echo "  test-python: ${NEEDS_TEST_PYTHON_RESULT}"
          echo "  docker-build: ${NEEDS_DOCKER_BUILD_RESULT}"
          echo "  docker-compose-test: ${NEEDS_DOCKER_COMPOSE_TEST_RESULT}"
          echo "  ebpf-verification: ${NEEDS_EBPF_VERIFICATION_RESULT}"
          echo "  build-check: ${NEEDS_BUILD_CHECK_RESULT}"
          echo "  dependency-review: ${NEEDS_DEPENDENCY_REVIEW_RESULT}"
          echo "  fuzz: ${NEEDS_FUZZ_RESULT}"
          echo ""

          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ]; then
            echo "Some checks failed"
            exit 1
          elif [ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]; then
            echo "Some checks were cancelled"
            exit 1
          else
            echo "All checks passed!"
          fi
        env:
          NEEDS_LINT_RESULT: ${{ needs.lint.result }}
          NEEDS_ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          NEEDS_ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          NEEDS_PROTO_RESULT: ${{ needs.proto.result }}
          NEEDS_TEST_GO_RESULT: ${{ needs.test-go.result }}
          NEEDS_TEST_INTEGRATION_RESULT: ${{ needs.test-integration.result }}
          NEEDS_TEST_PYTHON_RESULT: ${{ needs.test-python.result }}
          NEEDS_DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
          NEEDS_DOCKER_COMPOSE_TEST_RESULT: ${{ needs.docker-compose-test.result }}
          NEEDS_EBPF_VERIFICATION_RESULT: ${{ needs.ebpf-verification.result }}
          NEEDS_BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          NEEDS_DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          NEEDS_FUZZ_RESULT: ${{ needs.fuzz.result }}
