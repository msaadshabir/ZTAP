name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: "0 2 * * *"

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python || steps.defaults.outputs.python }}
      docker: ${{ steps.filter.outputs.docker || steps.defaults.outputs.docker }}
      ebpf: ${{ steps.filter.outputs.ebpf || steps.defaults.outputs.ebpf }}

    steps:
      - name: Defaults for non-PR events
        id: defaults
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "python=true"
            echo "docker=true"
            echo "ebpf=true"
          } >> "$GITHUB_OUTPUT"

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          token: ${{ github.token }}
          filters: |
            python:
              - 'pkg/anomaly/**'
            docker:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'pkg/anomaly/Dockerfile'
              - 'Dockerfile.operator'
              - '.dockerignore'
            ebpf:
              - 'bpf/**'
              - 'pkg/enforcer/**'

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Run go vet
        run: |
          mapfile -t packages < <(go list ./... | grep -v '/examples/')
          if [ "${#packages[@]}" -gt 0 ]; then
            go vet "${packages[@]}"
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
        with:
          version: v2.8.0
          args: --timeout=5m

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
          "$(go env GOPATH)/bin/actionlint" -color

  test-go:
    name: Go Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GOFLAGS: -buildvcs=false

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v -covermode=atomic -coverpkg=./pkg/... -coverprofile=coverage-${{ matrix.os }}.out -timeout 10m

      - name: Coverage gate (pkg/, per-OS)
        run: go run ./cmd/covergate -coverprofile coverage-${{ matrix.os }}.out -repo .

      - name: Upload coverage artifact
        if: failure() || github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-${{ matrix.os }}
          path: coverage-${{ matrix.os }}.out
          if-no-files-found: ignore

  # Windows is covered via the 3-OS matrix in test-go.

  test-integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    env:
      GOFLAGS: -buildvcs=false

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run policy enforcer integration tests
        run: go test -v -timeout=60s -tags=integration ./pkg/enforcer/... -run TestPolicyEnforcer

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Dependency Review
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261
        with:
          fail-on-severity: moderate

  test-python:
    name: Python Anomaly Detection Tests
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

          cache: pip
          cache-dependency-path: pkg/anomaly/requirements.txt

      - name: Install dependencies
        working-directory: pkg/anomaly
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Run Python tests
        working-directory: pkg/anomaly
        run: python -m pytest test_service.py -v --cov=service --cov-report=xml

      - name: Upload Python coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: python-coverage
          path: pkg/anomaly/coverage.xml

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ebpf == 'true'
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build ZTAP Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ztap:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Anomaly Detector Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./pkg/anomaly
          file: ./pkg/anomaly/Dockerfile
          push: false
          tags: ztap-anomaly:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ZTAP Operator Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile.operator
          push: false
          tags: ztap-operator:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Compose Stack
        if: github.event_name != 'pull_request'
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.yml up -d
          sleep 10
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml down

  ebpf-verification:
    name: eBPF Verification (Linux)
    runs-on: ubuntu-latest
    needs: [lint, test-go, changes]
    # Forked PRs cannot run privileged eBPF steps
    if: (github.event_name != 'pull_request' || needs.changes.outputs.ebpf == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 30
    env:
      GOFLAGS: -buildvcs=false

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make

      - name: Download dependencies
        run: go mod download

      - name: Compile eBPF program
        run: |
          make -C bpf
          sudo mkdir -p /usr/local/share/ztap/bpf
          sudo cp -v bpf/filter.o /usr/local/share/ztap/bpf/filter.o

      - name: Inspect eBPF object (ELF)
        run: |
          which llvm-objdump || true
          which llvm-readelf || true
          echo "ls -l built object and system path" && ls -l bpf/filter.o /usr/local/share/ztap/bpf/filter.o
          echo "readelf -S" && (llvm-readelf -S bpf/filter.o || readelf -S bpf/filter.o)
          echo "objdump -h" && (llvm-objdump -h bpf/filter.o || objdump -h bpf/filter.o)

      - name: Run eBPF integration test
        env:
          ZTAP_BPF_OBJECT: /usr/local/share/ztap/bpf/filter.o
          ZTAP_DEBUG_EBPF: "1"
        run: sudo --preserve-env=PATH,HOME,GOFLAGS,GOMODCACHE,GOCACHE,ZTAP_BPF_OBJECT,ZTAP_DEBUG_EBPF go test -tags integration ./pkg/enforcer -run TestEBPFIntegrationLoadAndAttach -v

  coverage-report:
    name: Generate Coverage Report
    needs: [test-go, test-python]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && always() && (needs.test-go.result == 'success' || needs.test-python.result == 'success')
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download all coverage artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: coverage-reports

      - name: Display coverage structure
        run: ls -R coverage-reports

      - name: Generate combined coverage report
        run: |
          {
            printf '## Test Coverage Summary\n\n'
            for file in coverage-reports/coverage-*/coverage-*.out; do
              if [ -f "$file" ]; then
                os=$(basename "$(dirname "$file")")
                os=${os#coverage-}
                printf '### %s\n' "$os"
                go tool cover -func="$file" | tail -1
                printf '\n'
              fi
            done
          } > coverage-summary.md

      - name: Upload coverage summary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-summary
          path: coverage-summary.md

  build-check:
    name: Build Check (Multi-Platform)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]') }}

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out=ztap-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${GOOS}" = "windows" ]; then
            out="${out}.exe"
          fi
          go build -o "${out}" .
          ls -lh "${out}"

  benchmark:
    name: Benchmark Tests
    runs-on: ubuntu-latest
    needs: test-go
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: |
          go test ./pkg/... -bench=. -benchmem -run=^$ > benchmark-results.txt || true
          cat benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: benchmark-results
          path: benchmark-results.txt

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - lint
      - actionlint
      - test-go
      - test-integration
      - test-python
      - docker-build
      - ebpf-verification
      - build-check
      - dependency-review
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check all jobs status
        run: |
          echo "Job Results:"
          echo "  lint: ${{ needs.lint.result }}"
          echo "  actionlint: ${{ needs.actionlint.result }}"
          echo "  test-go: ${{ needs.test-go.result }}"
          echo "  test-windows: ${{ needs.test-windows.result }}"
          echo "  test-integration: ${{ needs.test-integration.result }}"
          echo "  test-python: ${{ needs.test-python.result }}"
          echo "  docker-build: ${{ needs.docker-build.result }}"
          echo "  ebpf-verification: ${{ needs.ebpf-verification.result }}"
          echo "  build-check: ${{ needs.build-check.result }}"
          echo "  dependency-review: ${{ needs.dependency-review.result }}"
          echo ""

          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ]; then
            echo "Some checks failed"
            exit 1
          elif [ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]; then
            echo "Some checks were cancelled"
            exit 1
          else
            echo "All checks passed!"
          fi
