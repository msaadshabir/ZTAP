name: Security

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    # Run lightweight security checks on PRs; heavy checks run on main only
    types: [opened, synchronize, reopened]
  schedule:
    # Weekly security sweep (Monday 03:00 UTC)
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

jobs:
  security:
    name: Govulncheck + Gosec (light)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZTAP_SECURITY_SKIP_TESTS: "1"
      ZTAP_SECURITY_SKIP_VET: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run scripted security checks
        run: |
          chmod +x scripts/security_check.sh
          ./scripts/security_check.sh

  security-deep:
    name: Trivy + SARIF upload (main only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    needs: security
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run Trivy filesystem scan and upload SARIF
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@45cbd0c69e560cd9e7cd7f8c32362050c9b7ded2
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true
