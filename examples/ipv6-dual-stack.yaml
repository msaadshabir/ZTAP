apiVersion: ztap/v1
kind: NetworkPolicy
metadata:
  name: ipv6-dual-stack
spec:
  podSelector:
    matchLabels:
      app: web
  ingress:
    - from:
        ipBlock:
          cidr: 2001:db8::/32
      ports:
        - protocol: TCP
          port: 80
    - from:
        ipBlock:
          cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        ipBlock:
          cidr: 2606:4700:4700::1111/128
      ports:
        - protocol: UDP
          port: 53
