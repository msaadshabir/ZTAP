version: v1

lint:
  use:
    - STANDARD
  except:
    # The proto tree intentionally lives under proto/ while declaring package
    # ztap.api.v1, and RPCs use compact request/response message names.
    - PACKAGE_DIRECTORY_MATCH
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE

breaking:
  use:
    - FILE
