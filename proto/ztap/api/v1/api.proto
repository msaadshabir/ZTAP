syntax = "proto3";

package ztap.api.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "ztap/proto/ztap/api/v1;apiv1";

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string username = 2;
  string role = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message WhoAmIResponse {
  string username = 1;
  string role = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message StatusResponse {
  string os = 1;
  string arch = 2;
  string hostname = 3;
  int64 pid = 4;
  string uptime = 5;
}

message EnforcementStatusResponse {
  string platform = 1;
  bool ebpf_active = 2;
  string flow_events_pin_path = 3;
}

message EnforcementStartRequest {
  string policy_yaml = 1;
  string policy_name = 2;
  string cgroup = 3;
  string bpf_object = 4;
  bool debug_ebpf = 5;
}

message EnforcementStartResponse {
  bool enforced = 1;
  string platform = 2;
}

message EnforcementStopResponse {
  bool stopped = 1;
}

message FlowEvent {
  google.protobuf.Timestamp timestamp = 1;
  string source_ip = 2;
  string dest_ip = 3;
  uint32 source_port = 4;
  uint32 dest_port = 5;
  string protocol = 6;
  string direction = 7;
  string action = 8;
}

message PolicySummary {
  string tenant = 1;
  string name = 2;
  int64 version = 3;
  string source = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message Policy {
  string tenant = 1;
  string name = 2;
  int64 version = 3;
  string source = 4;
  google.protobuf.Timestamp updated_at = 5;
  string policy_yaml = 6;
}

message PolicyRevision {
  string tenant = 1;
  string name = 2;
  int64 version = 3;
  string source = 4;
  google.protobuf.Timestamp created_at = 5;
  string reason = 6;
  bool deleted = 7;
  int64 rollback_from_version = 8;
  bool has_rollback_from_version = 9;
  string policy_yaml = 10;
}

message ListPoliciesRequest {
  string tenant = 1;
}

message ListPoliciesResponse {
  repeated PolicySummary policies = 1;
}

message GetPolicyRequest {
  string tenant = 1;
  string name = 2;
}

message GetPolicyResponse {
  Policy policy = 1;
}

message PutPolicyRequest {
  string tenant = 1;
  string name = 2;
  string policy_yaml = 3;
  string reason = 4;
  int64 expected_version = 5;
  bool has_expected_version = 6;
}

message PutPolicyResponse {
  int64 version = 1;
}

message DeletePolicyRequest {
  string tenant = 1;
  string name = 2;
  string reason = 3;
}

message DeletePolicyResponse {
  int64 version = 1;
  bool deleted = 2;
}

message ListPolicyRevisionsRequest {
  string tenant = 1;
  string name = 2;
  int32 limit = 3;
  bool include_yaml = 4;
  bool has_limit = 5;
}

message ListPolicyRevisionsResponse {
  repeated PolicyRevision revisions = 1;
}

message GetPolicyRevisionRequest {
  string tenant = 1;
  string name = 2;
  int64 version = 3;
}

message GetPolicyRevisionResponse {
  PolicyRevision revision = 1;
}

message RollbackPolicyRequest {
  string tenant = 1;
  string name = 2;
  int64 to_version = 3;
  string reason = 4;
}

message RollbackPolicyResponse {
  int64 version = 1;
}

message User {
  string username = 1;
  string role = 2;
  bool enabled = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_login = 5;
}

message ListUsersResponse {
  repeated User users = 1;
}

message GetUserRequest {
  string username = 1;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string role = 3;
}

message CreateUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string username = 1;
  string role = 2;
  bool has_role = 3;
  bool enabled = 4;
  bool has_enabled = 5;
}

message UpdateUserResponse {
  User user = 1;
}

message SetUserPasswordRequest {
  string username = 1;
  string new_password = 2;
  string old_password = 3;
  bool has_old_password = 4;
}

message SetUserPasswordResponse {
  bool updated = 1;
}

message DeleteUserRequest {
  string username = 1;
}

message DeleteUserResponse {
  bool deleted = 1;
}

message ClusterNode {
  string id = 1;
  string address = 2;
  string role = 3;
  string state = 4;
  google.protobuf.Timestamp joined_at = 5;
  google.protobuf.Timestamp last_seen = 6;
  map<string, string> metadata = 7;
}

message ClusterStatus {
  ClusterNode leader = 1;
  bool is_leader = 2;
  repeated ClusterNode nodes = 3;
  google.protobuf.Timestamp updated_at = 4;
  int32 total_nodes = 5;
}

message GetClusterStatusResponse {
  ClusterStatus status = 1;
}

message ListNodesResponse {
  repeated ClusterNode nodes = 1;
}

message RegisterNodeRequest {
  ClusterNode node = 1;
}

message RegisterNodeResponse {
  ClusterNode node = 1;
}

message DeregisterNodeRequest {
  string node_id = 1;
}

message DeregisterNodeResponse {
  bool deleted = 1;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc WhoAmI(google.protobuf.Empty) returns (WhoAmIResponse);
}

service StatusService {
  rpc GetStatus(google.protobuf.Empty) returns (StatusResponse);
}

service EnforcementService {
  rpc GetStatus(google.protobuf.Empty) returns (EnforcementStatusResponse);
  rpc Start(EnforcementStartRequest) returns (EnforcementStartResponse);
  rpc Stop(google.protobuf.Empty) returns (EnforcementStopResponse);
}

service FlowsService {
  rpc Stream(google.protobuf.Empty) returns (stream FlowEvent);
}

service PolicyService {
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc PutPolicy(PutPolicyRequest) returns (PutPolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc ListPolicyRevisions(ListPolicyRevisionsRequest) returns (ListPolicyRevisionsResponse);
  rpc GetPolicyRevision(GetPolicyRevisionRequest) returns (GetPolicyRevisionResponse);
  rpc RollbackPolicy(RollbackPolicyRequest) returns (RollbackPolicyResponse);
}

service UsersService {
  rpc ListUsers(google.protobuf.Empty) returns (ListUsersResponse);
  rpc GetUser(GetUserRequest) returns (User);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc SetUserPassword(SetUserPasswordRequest) returns (SetUserPasswordResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

service ClusterService {
  rpc GetClusterStatus(google.protobuf.Empty) returns (GetClusterStatusResponse);
  rpc ListNodes(google.protobuf.Empty) returns (ListNodesResponse);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc DeregisterNode(DeregisterNodeRequest) returns (DeregisterNodeResponse);
}
