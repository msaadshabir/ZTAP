# osv-scanner ignore list
#
# GO-2026-5932 flags the golang.org/x/crypto/openpgp package as unmaintained.
# ZTAP does NOT import openpgp; the project only uses golang.org/x/crypto/bcrypt
# (see internal/auth/auth.go). The advisory currently has no fixed version, so the
# dependency cannot be bumped to a non-vulnerable release. This ignore records
# that the vulnerability does not affect this codebase.
# Docs: https://google.github.io/osv-scanner/#ignore-vulnerabilities-by-id

[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "ZTAP does not import golang.org/x/crypto/openpgp; only bcrypt is used. No fixed version is available upstream."