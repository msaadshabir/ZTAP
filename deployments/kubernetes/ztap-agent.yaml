# Install the admission guard before creating the agent or workload Pods.
# It applies cluster-wide to non-host-network Pods, including debug containers.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztap-packet-socket-isolation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  matchConditions:
    - name: managed-network
      expression: '!has(object.spec.hostNetwork) || !object.spec.hostNetwork'
  variables:
    - name: securityContexts
      expression: >-
        object.spec.containers.map(c, has(c.securityContext) ? c.securityContext : null) +
        (has(object.spec.initContainers) ? object.spec.initContainers.map(c, has(c.securityContext) ? c.securityContext : null) : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers.map(c, has(c.securityContext) ? c.securityContext : null) : [])
  validations:
    - expression: >-
        variables.securityContexts.all(s,
          s != null &&
          (!has(s.privileged) || !s.privileged) &&
          has(s.allowPrivilegeEscalation) && !s.allowPrivilegeEscalation &&
          has(s.capabilities) && has(s.capabilities.drop) &&
          s.capabilities.drop.exists(c, c == 'ALL' || c == 'NET_RAW') &&
          (!has(s.capabilities.add) || s.capabilities.add.all(c, c != 'NET_RAW' && c != 'SYS_ADMIN')))
      message: 'ZTAP requires each container to drop NET_RAW or ALL, forbid NET_RAW/SYS_ADMIN additions and privileged mode, and set allowPrivilegeEscalation=false.'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztap-packet-socket-isolation
spec:
  policyName: ztap-packet-socket-isolation
  validationActions: [Deny]
---
apiVersion: v1
kind: Namespace
metadata:
  name: ztap-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztap-agent
  namespace: ztap-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ztap-agent
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ztap-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ztap-agent
subjects:
  - kind: ServiceAccount
    name: ztap-agent
    namespace: ztap-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ztap-agent
  namespace: ztap-system
spec:
  selector:
    matchLabels:
      app: ztap-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: ztap-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: ztap-agent
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: agent
          image: ztap:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - agent
            - --node-name=$(NODE_NAME)
            - --cgroup-root=/host/sys/fs/cgroup
            - --bpffs-root=/host/sys/fs/bpf
            - --run-dir=/run/ztap
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - BPF
                - NET_ADMIN
                - PERFMON
                - SYS_RESOURCE
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: bpffs
              mountPath: /host/sys/fs/bpf
            - name: run-dir
              mountPath: /run/ztap
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: run-dir
          hostPath:
            path: /run/ztap
            type: DirectoryOrCreate
