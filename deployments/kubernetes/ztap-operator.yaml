apiVersion: v1
kind: Namespace
metadata:
  name: ztap-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztap-operator
  namespace: ztap-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ztap-operator-leader-election
  namespace: ztap-system
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ztap-operator-leader-election
  namespace: ztap-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ztap-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: ztap-operator
    namespace: ztap-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ztap-operator
rules:
  - apiGroups:
      - ztap.io
    resources:
      - ztapnetworkpolicies
      - ztapnetworkpolicies/status
      - ztapnetworkpolicies/finalizers
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ztap-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ztap-operator
subjects:
  - kind: ServiceAccount
    name: ztap-operator
    namespace: ztap-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ztap-operator
  namespace: ztap-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ztap-operator
  template:
    metadata:
      labels:
        app: ztap-operator
    spec:
      serviceAccountName: ztap-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: manager
          image: ztap-operator:latest
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
            - name: healthz
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ztap-operator
  namespace: ztap-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ztap-operator
