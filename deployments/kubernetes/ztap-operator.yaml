apiVersion: v1
kind: Namespace
metadata:
  name: ztap-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztap-operator
  namespace: ztap-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ztap-operator
rules:
  - apiGroups:
      - ztap.io
    resources:
      - ztapnetworkpolicies
      - ztapnetworkpolicies/status
      - ztapnetworkpolicies/finalizers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ztap-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ztap-operator
subjects:
  - kind: ServiceAccount
    name: ztap-operator
    namespace: ztap-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ztap-operator
  namespace: ztap-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ztap-operator
  template:
    metadata:
      labels:
        app: ztap-operator
    spec:
      serviceAccountName: ztap-operator
      containers:
        - name: manager
          image: ztap-operator:latest
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
            - name: healthz
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
